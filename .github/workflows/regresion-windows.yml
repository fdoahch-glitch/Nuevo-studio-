name: Regresion y compilacion Windows

on:
  push:
    branches: [main, "integracion/**"]
    paths:
      - "core/**"
      - "src-tauri/**"
      - "web/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "baseline/original-manifest.json"
      - ".github/workflows/regresion-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regresion:
    name: Verificar preservacion del original
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Comparar inventario y contenido original
        id: audit
        shell: pwsh
        run: |
          $manifest = Get-Content "baseline/original-manifest.json" -Raw | ConvertFrom-Json
          $results = @()
          foreach ($entry in $manifest.files) {
            $path = [string]$entry.path
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              $results += [pscustomobject]@{ path=$path; status="MISSING"; expected_size=$entry.size; actual_size=$null; expected_blob=$entry.sha; actual_blob=$null }
              continue
            }
            $item = Get-Item -LiteralPath $path
            $blob = (git hash-object -- $path).Trim()
            $status = if ($item.Length -eq [long]$entry.size -and $blob -eq [string]$entry.sha) { "OK" } elseif ($item.Length -ne [long]$entry.size) { "SIZE_MISMATCH" } else { "CONTENT_MISMATCH" }
            $results += [pscustomobject]@{ path=$path; status=$status; expected_size=$entry.size; actual_size=$item.Length; expected_blob=$entry.sha; actual_blob=$blob }
          }
          $added = @(git ls-files | Where-Object { $_ -notin @($manifest.files | ForEach-Object { $_.path }) })
          $report = [ordered]@{
            source_repository = $manifest.source_repository
            source_ref = $manifest.source_ref
            source_tree_sha = $manifest.source_tree_sha
            checked_original_files = $manifest.original_file_count
            preserved = @($results | Where-Object status -eq "OK").Count
            missing = @($results | Where-Object status -eq "MISSING").Count
            changed = @($results | Where-Object status -in @("SIZE_MISMATCH","CONTENT_MISMATCH")).Count
            added_files = $added
            results = $results
            generated_utc = (Get-Date).ToUniversalTime().ToString("o")
          }
          $report | ConvertTo-Json -Depth 8 | Set-Content "regression-report.json" -Encoding utf8
          "### Informe de regresion del original" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "| Verificacion | Resultado |" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "|---|---:|" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "| Archivos originales | $($manifest.original_file_count) |" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "| Conservados exactamente | $($report.preserved) |" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "| Faltantes | $($report.missing) |" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "| Modificados | $($report.changed) |" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "| Archivos nuevos permitidos | $($added.Count) |" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          if ($report.missing -gt 0 -or $report.changed -gt 0) {
            "RESULTADO: NO APROBADO. No se permite cerrar esta etapa." | Out-File $env:GITHUB_STEP_SUMMARY -Append
            exit 1
          }
          "RESULTADO: APROBADO. Todos los archivos originales están intactos." | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - name: Publicar informe JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-regresion-windows
          path: regression-report.json
          if-no-files-found: warn

  compilar:
    name: Compilar instalador Windows x64
    needs: regresion
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar FFmpeg y ONNX Runtime para Windows
        shell: pwsh
        run: ./scripts/bajar-binarios.ps1
      - name: Pruebas del núcleo
        shell: pwsh
        run: |
          python -m pip install -q onnx numpy
          python scripts/modelo_prueba.py "$env:RUNNER_TEMP\prueba.onnx"
          $env:ATRAPA_FFMPEG = (Resolve-Path src-tauri\bin\ffmpeg.exe).Path
          $env:ATRAPA_ORT_LIB = (Resolve-Path src-tauri\bin\onnxruntime.dll).Path
          $env:ATRAPA_MODELO_PRUEBA = "$env:RUNNER_TEMP\prueba.onnx"
          $env:PATH = "$((Resolve-Path src-tauri\bin).Path);$env:PATH"
          cargo test -p atrapa-core -- --nocapture
      - name: Compilar instalador NSIS
        shell: pwsh
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Nuevo-Studio-Windows-x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
